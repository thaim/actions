# Reusable workflow for GitHub Actions security checks.
# Usage:
#   permissions: {}
#
#   jobs:
#     security:
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: thaim/actions/.github/workflows/reusable-gha-security.yml@v2.0.0
#
# Checks:
#   - jdx/jactionlint: Lints workflow YAML files with the profile of the caller's
#     .github/jactionlint.yaml, or the default profile, which adds security and
#     policy rules to the checks of rhysd/actionlint. Set "profile: correctness"
#     there to keep only the checks of rhysd/actionlint.
#   - ghalint: Checks GitHub Actions security best practices
#   - zizmor: Detects security vulnerabilities in GitHub Actions workflows
#
# Note:
#   This workflow uses individual composite actions (run-ghalint, run-zizmor)
#   with absolute references because reusable workflows resolve relative paths
#   against the caller repository, not this repository.
#   jdx/jactionlint runs through thaim/action-reviewdog-jactionlint.
name: Reusable GitHub Actions Security Checks

on:
  workflow_call:

permissions: {}

jobs:
  security-checks:
    name: GitHub Actions Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ghalint
        uses: thaim/actions/actions/run-ghalint@6f125b434752f00a844f9a7c7a672dab21e336b6 # PR#42
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
      - id: zizmor
        uses: thaim/actions/actions/run-zizmor@6f125b434752f00a844f9a7c7a672dab21e336b6 # PR#42
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
      - id: jactionlint
        uses: thaim/action-reviewdog-jactionlint@7b4eb1ef623a3a957ce45912bce3ba8b599c2fdc # v0.1.0
        continue-on-error: true
        with:
          # The local reporter on push needs no checks: write, which callers do not grant.
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'local' }}
          filter_mode: ${{ github.event_name == 'pull_request' && 'added' || 'nofilter' }}
          fail_level: error
      - name: Check results
        if: always()
        env:
          GHALINT_OUTCOME: ${{ steps.ghalint.outcome }}
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
          JACTIONLINT_OUTCOME: ${{ steps.jactionlint.outcome }}
        run: |
          failed=false
          if [ "$GHALINT_OUTCOME" = "failure" ]; then
            echo "::error::ghalint failed"
            failed=true
          fi
          if [ "$ZIZMOR_OUTCOME" = "failure" ]; then
            echo "::error::zizmor failed"
            failed=true
          fi
          if [ "$JACTIONLINT_OUTCOME" = "failure" ]; then
            echo "::error::jactionlint failed"
            failed=true
          fi
          if [ "$failed" = "true" ]; then
            exit 1
          fi
