name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, unlabeled]

permissions: {}

# Do not cancel a release in progress, so that tagpr never stops between tagging and creating the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/reusable-release.yml
