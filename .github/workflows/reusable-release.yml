# Reusable workflow for automated release management using tagpr.
#
# Pairs with reusable-conventional-pr.yml: tagpr relies on the PR labels and
# conventional-commit PR titles produced by that workflow to decide version
# bumps and group changelog entries. Adopt both workflows together.
#
# Usage:
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       types: [labeled, unlabeled]
#
#   jobs:
#     release:
#       uses: thaim/actions/.github/workflows/reusable-release.yml@v1.0.2
#
# Features:
#   - Songmu/tagpr: Automatically creates release PRs and tags on push to main.
#     Adding `tagpr:major` or `tagpr:minor` to a release PR (branches with the
#     `tagpr-from-` prefix) triggers a re-run to recompute the version bump.
name: Reusable Release

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    if: >-
      github.event_name != 'pull_request'
      || (contains(fromJSON('["tagpr:major","tagpr:minor"]'), github.event.label.name)
          && startsWith(github.event.pull_request.head.ref, 'tagpr-from-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: tagpr-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - uses: Songmu/tagpr@e84001bd5dac8defa0c75b3913937d284a3b3660 # v1.20.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # tagpr uses the first line of the template as the release PR title.
          # Prefix it with a conventional-commit type so the release PR passes
          # reusable-conventional-pr.yml without any per-repository .tagpr config.
          TAGPR_TEMPLATE_TEXT: |
            chore: Release for {{.NextVersion}}

            {{.Changelog}}
