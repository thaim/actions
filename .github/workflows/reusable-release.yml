# Reusable workflow for automated release management using tagpr.
#
# Pairs with reusable-conventional-pr.yml: tagpr relies on the PR labels and
# conventional-commit PR titles produced by that workflow to decide version
# bumps and group changelog entries. Adopt both workflows together.
#
# Usage:
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       types: [labeled, unlabeled]
#
#   jobs:
#     release:
#       uses: thaim/actions/.github/workflows/reusable-release.yml@v1.0.2
#
# Features:
#   - Songmu/tagpr: Automatically creates release PRs and tags on push to main.
#     Adding `tagpr:major` or `tagpr:minor` to a release PR (branches with the
#     `tagpr-from-` prefix) triggers a re-run to recompute the version bump.
name: Reusable Release

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    if: >-
      github.event_name != 'pull_request'
      || (contains(fromJSON('["tagpr:major","tagpr:minor"]'), github.event.label.name)
          && startsWith(github.event.pull_request.head.ref, 'tagpr-from-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: tagpr-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: Songmu/tagpr@d1b8138b7a31075141b6cd64103de9485ced7ac9 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # tagpr uses the first line of the template as the release PR title.
          # This is tagpr's default PR template (defaultTmplStr, v1.20.0) with a
          # conventional-commit `chore:` prefix prepended to the title line, so the
          # release PR passes reusable-conventional-pr.yml with no per-repository
          # .tagpr config. Keep the body in sync with tagpr's defaultTmplStr on upgrades.
          TAGPR_TEMPLATE_TEXT: |
            chore: {{if .TagPrefix}}[{{.TagPrefix}}] {{end}}Release for {{.NextVersion}}

            This pull request is for the next release as {{.NextVersion}} created by [tagpr](https://github.com/Songmu/tagpr). Merging it will tag {{.NextVersion}} to the merge commit and create a GitHub release.

            You can modify this branch "{{.Branch}}" directly before merging if you want to change the next version number or other files for the release.

            <details>
            <summary>How to change the next version as you like</summary>

            There are two ways to do it.

            - Version file
                - Edit and commit the version file specified in the .tagpr configuration file to describe the next version
                - If you want to use another version file, edit the configuration file.
            - Labels convention
                - Add labels to this pull request like "tagpr:minor" or "tagpr:major"
                - If no conventional labels are added, the patch version is incremented as is.
            </details>

            ---
            {{.Changelog}}
