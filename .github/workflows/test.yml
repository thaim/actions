name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests use only node:test and node:assert, so the runner's preinstalled
      # Node covers them: no package.json, no install step, no version to pin.
      # `node --test` without arguments discovers every *.test.js under the repository.
      - run: node --test
