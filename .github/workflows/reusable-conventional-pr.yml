# Reusable workflow that enforces conventional commit convention on PRs.
# Validates the PR title format and applies labels derived from the title's type
# in a single caller invocation.
#
# Pairs with reusable-release.yml: the labels applied here (enhancement, bug, ...)
# feed tagpr's version-bump detection and changelog grouping.
#
# Usage:
#   on:
#     pull_request:
#       types: [opened, edited, synchronize]
#
#   jobs:
#     conventional-pr:
#       uses: thaim/actions/.github/workflows/reusable-conventional-pr.yml@v2.0.0
#
# Inputs (optional):
#   - types: Newline-separated list of allowed conventional commit types
#   - type_labels: JSON object mapping each type to a label name
#   - breaking_labels: Labels applied when the title marks a breaking change with `!`
#
# Note:
#   Keep `types` and `type_labels` consistent. A type listed in `types` but
#   missing from `type_labels` will receive the default "other" label, which
#   defeats the purpose of this workflow.
#
# Steps:
#   - amannn/action-semantic-pull-request: Validates PR title follows conventional commit format
#   - thaim/actions/actions/sync-pr-labels: Assigns labels based on PR title type and the `!` breaking marker, only updating when current labels diverge from the desired state
name: Reusable Conventional PR

on:
  workflow_call:
    inputs:
      types:
        description: "Newline-separated list of allowed conventional commit types"
        required: false
        type: string
        default: |
          feat
          fix
          ci
          docs
          refactor
          chore
      type_labels:
        description: "JSON object mapping conventional commit types to label names"
        required: false
        type: string
        default: |
          {
            "feat": "enhancement",
            "fix": "bug",
            "ci": "ci",
            "docs": "documentation",
            "refactor": "refactor",
            "chore": "chore"
          }
      breaking_labels:
        description: "Newline-separated labels applied when the PR title marks a breaking change with `!`; empty disables the marker"
        required: false
        type: string
        default: "breaking-change"

permissions:
  contents: read
  pull-requests: write

jobs:
  conventional-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ inputs.types }}
      - uses: thaim/actions/actions/sync-pr-labels@29266d872410ee27f0ec50024c761ba6c810b2ae # PR#65
        with:
          type_labels: ${{ inputs.type_labels }}
          breaking_labels: ${{ inputs.breaking_labels }}
          github_token: ${{ github.token }}
